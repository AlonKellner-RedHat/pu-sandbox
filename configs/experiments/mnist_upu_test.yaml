# uPU (Unbiased PU) Experiment
# PU learning with unbiased risk estimator (can produce negative risk)

experiment:
  name: "mnist_upu"
  description: "uPU with 100 positive and ~59,900 unlabeled samples"

# Data configuration
data:
  dataset: "mnist"
  n_positive: 100
  positive_class_label: "even"  # Even digits (0,2,4,6,8)
  # Unlabeled set contains remaining samples (both positive and negative)

# Model configuration
model:
  architecture: "mlp6layer"
  input_dim: 784
  hidden_dims: [300, 300, 300, 300, 300]
  output_dim: 1

# Loss configuration
loss:
  type: "upu"
  prior: 0.5  # Class prior π = P(y=1), approximately 0.5 for even/odd split

# Training configuration
training:
  batch_size: 256
  epochs: 10
  learning_rate: 0.001
  optimizer: "adam"
  device: "mps"  # Use MPS on M4 MacBook, fallback to CUDA/CPU

# Reproducibility
seed: 42

# Logging
logging:
  log_interval: 2  # Log every N epochs
  save_model: true
  checkpoint_dir: "experiments/results/mnist_upu_test"
  track_negative_risk: true  # Track when loss becomes negative
