[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pu-learning"
version = "0.1.0"
description = "PyTorch implementation of Positive-Unlabeled learning methods (nnPU paper reproduction)"
authors = [{name = "PU Learning Researcher"}]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "hvplot>=0.9.0",
    "holoviews>=1.18.0",
    "bokeh>=3.3.0",
    "panel>=1.3.0",
    "pyyaml>=6.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    # Note: ty is not yet released - will add when available from Astral.sh
    # "ty>=0.1.0",  # Astral.sh's fast type checker (not yet released)
    "pre-commit>=3.5.0",
    "ipython>=8.14.0",
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
]

[tool.setuptools]
packages = ["pu_learning"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--cov=pu_learning",
    "--cov-report=html",
    "--cov-report=term",
    "--cov-fail-under=80",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "SIM",    # flake8-simplify
    "PTH",    # flake8-use-pathlib
    "PGH",    # pygrep-hooks (replaces pre-commit pygrep-hooks)
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# Type checking configuration for ty (Astral.sh)
# Note: ty is not yet released - configuration will be added when available
# [tool.ty]
# python_version = "3.9"
# strict = true
